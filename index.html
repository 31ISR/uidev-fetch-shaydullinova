<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Мой список аниме</title>
        <link rel="stylesheet" href="style.css" />
        <script defer src="script.js"></script>
    </head>
    <body>
        <main>
            <table id="anime-list">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Image</th>
                        <th>Anime Title</th>
                        <th>Score</th>
                        <th>Type</th>
                        <th>Progress</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="n">1</td>
                        <td class="cover">
                            <img
                                src="https://cdn.myanimelist.net/images/anime/1408/114012.jpg"
                                alt=""
                                loading="lazy" />
                        </td>
                        <td class="title"><a href="#">Akira</a></td>
                        <td><span class="score s10">10</span></td>
                        <td>Movie</td>
                        <td>
                            <div class="prog st1">
                                <span style="width: 100%"></span>
                            </div>
                            <small>1 / 1</small>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
